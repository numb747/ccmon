<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 监控 · 夜景公寓</title>
<style>
:root{
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code","Adwaita Mono","Sarasa Mono SC",Consolas,monospace;
  /* 夜：近黑 → 靛 → 地平线一点点暖灰。暖色只留给「有人在干活」 */
  --sky0:#0b0c14; --sky1:#111320; --sky2:#181b2d; --sky3:#23263a; --sky4:#353542; --sky5:#4d4441;
  --far:#2a2a3a; --near:#1b1d2c;
  --facade:#252839; --ledge:#33374f; --frame:#12131c;
  --ground:#1c1f2e; --street:#101119;
  --fg:#c0caf5; --fg2:#a9b1d6; --fg3:#9aa5ce;
  --lamp:#e0af68; --cream:#ece0c3; --ink:#1f2131; --red:#f7768e;
  --moon:#dfe5f7;
  --ww:286px; --wh:204px; --gap:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans); color:var(--fg); font-size:15px;
  background:linear-gradient(to bottom,var(--sky0) 0%,var(--sky1) 22%,var(--sky2) 40%,var(--sky3) 55%,var(--sky4) 66%,var(--sky5) 78%) fixed;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

#scene{position:fixed;inset:0;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
#scene.zoomed{transform:scale(1.18)}
#scene.zoomed *{animation-play-state:paused!important}  /* 屋里看详情时，楼外的动画先停，省 CPU */
#scene.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3b4261 transparent}

/* ---------- 天空 ---------- */
.stars{position:fixed;inset:0 0 40% 0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#c0caf5}
.stars i.b{width:3px;height:3px}
.stars i.tw{animation:tw 6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.85}}
.moon{position:fixed;right:150px;top:58px;width:120px;height:120px}

.status{position:fixed;left:84px;top:54px;max-width:1000px;z-index:2}
.status .hl{font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1.2;color:var(--fg)}
.status .hl b{font-family:var(--mono);font-weight:700}
.status .hl .lit{color:var(--lamp)}
.status .hl .sl{color:#89a7e8}
.status .hl .wt{color:var(--red)}
.status .hl .sep{color:#565f89;margin:0 .35em;font-weight:400}
.crumbs{position:fixed;left:84px;top:12px;z-index:7;max-width:calc(100vw - 200px);display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--fg3);letter-spacing:.04em}
.crumbs a{color:inherit;text-decoration:none;cursor:pointer}
.crumbs a b{color:var(--fg)}
.crumbs .here{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crumbs a:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.status .sub{margin-top:12px;font-size:14px;color:var(--fg3);letter-spacing:.04em}
.status .sub .m{font-family:var(--mono)}
.status .conn{margin-top:8px;font-size:13px;color:#e0c08a;display:none}
.status .conn.show{display:block}
.status .tools{margin-top:10px;display:flex;gap:16px}
.status .tools button{font-size:13px;color:var(--fg3);border-bottom:1px dashed #3e4567;padding-bottom:1px}
.status .tools button:hover{color:var(--fg)}
.status .tools button.on{color:var(--lamp);border-bottom-color:#7a6440}

/* ---------- 远景楼 ---------- */
.skyline{position:fixed;left:0;right:0;bottom:46px;width:100%;pointer-events:none}

/* ---------- 公寓 ---------- */
.building{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch}
.roof{position:relative;height:44px}
.roof .parapet{position:absolute;left:-10px;right:-10px;bottom:0;height:16px;background:#2e3249;border-radius:2px 2px 0 0}
.roof .tank{position:absolute;right:70px;bottom:16px;width:86px;height:70px}
.roof .antenna{position:absolute;left:84px;bottom:16px;width:40px;height:74px}

/* 楼顶那只 Clawd：承担全局状态 */
.roofc{position:absolute;bottom:13px;left:200px}
/* 楼顶这只是「楼管」：平时不在，只有有人等你时才跑上房顶喊；点它直接进那一户 */
.roofc:not(.alert){display:none}
.roofc.alert{cursor:pointer}
.roofc .bub{position:absolute;left:calc(100% + 2px);bottom:22px;white-space:nowrap;font-size:13px;font-weight:700;color:#2b1d22;background:#f3c6cf;padding:3px 9px;border-radius:4px;display:none}
.roofc.alert .bub{display:block}
.roofc .bub::before{content:"";position:absolute;left:-6px;bottom:6px;border:4px solid transparent;border-right:6px solid #f3c6cf;border-left:0}
/* 窗里的住户 */
.clawd.res{position:absolute!important;left:50%;bottom:4%;transform:translateX(-50%)}
.clawd.mini{position:absolute!important;bottom:2%}
.clawd.m0{left:17%}.clawd.m1{right:18%}.clawd.m2{left:31%;bottom:0}
.cool .glass .clawd img,.rw.dim .clawd img{filter:brightness(.7) saturate(.7) hue-rotate(-8deg)}  /* 熄灯：住户沉进冷光里，但不透明，轮廓清楚 */
.s-dead .glass .clawd img,.rw.gone .clawd img{filter:brightness(.5) saturate(.4)}
.ava{width:20px;height:auto;image-rendering:pixelated}

.body{position:relative;background:var(--facade);
  background-image:repeating-linear-gradient(to bottom,transparent 0 23px,rgba(0,0,0,.09) 23px 24px),
    linear-gradient(to right,rgba(0,0,0,.18) 0,transparent 26px,transparent calc(100% - 18px),rgba(160,175,230,.05) calc(100% - 18px));
  padding:0 70px}
.body::after{content:"";position:absolute;right:30px;top:0;bottom:0;width:7px;background:#30344b;border-left:1px solid #3a3f58}
.floor{display:grid;grid-template-columns:repeat(var(--cols),var(--ww));column-gap:var(--gap);justify-content:center;
  padding:30px 0 22px;border-top:7px solid var(--ledge)}
.floor:first-child{border-top:0}
.vacant{grid-column:1/-1;width:440px;padding:26px 0 30px;text-align:center}
.vacant .w{margin:0 auto 18px;width:220px;height:140px;border:8px solid var(--frame);border-radius:3px;background:linear-gradient(#1b1f31,#222840);position:relative}
.vacant .w::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,#2b3150 0 16px,#232842 16px 19px)}
.vacant p{font-size:15px;color:var(--fg2)}

.unit{position:relative;display:flex;flex-direction:column;align-items:center;outline:none}
.win{position:relative;width:var(--ww);height:var(--wh);border:8px solid var(--frame);border-radius:3px;
  box-shadow:inset 0 0 0 2px #2c3150;background:#0e0f17;transition:transform .35s ease}
.win .glass{position:absolute;inset:0;overflow:hidden}
.win .glass svg{display:block;width:100%;height:100%}
.win .glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,transparent 0 18%,rgba(255,255,255,.07) 18% 22%,transparent 22% 27%,rgba(255,255,255,.045) 27% 29%,transparent 29%)}
.win .transom{position:absolute;left:0;right:0;top:22%;height:5px;background:var(--frame)}
/* 开灯 / 关灯的短过渡 */
.win .sw{position:absolute;inset:0;pointer-events:none;opacity:0}
.win .sw.on{background:#0e0f17;animation:lighton .9s ease-out}
.win .sw.off{background:#f3d9a6;animation:lightoff 1.1s ease-out}
@keyframes lighton{0%{opacity:1}25%{opacity:.35}38%{opacity:.9}55%{opacity:.2}100%{opacity:0}}
@keyframes lightoff{0%{opacity:.75}100%{opacity:0}}
.sill{width:calc(var(--ww) + 16px);height:9px;background:#3d4260;border-bottom:3px solid #2a2e44;border-radius:1px;transition:background .6s}
.unit:not(.cool) .sill{background:#6e5a44;border-bottom-color:#4a3e36}
.unit:hover .win,.unit:focus-visible .win{transform:translateY(-3px)}
.unit:focus-visible .plate{outline:2px solid var(--lamp);outline-offset:3px}

.zz{position:absolute;left:18%;top:-14px;width:40px;height:70px;pointer-events:none;font-family:var(--mono);color:var(--fg);font-weight:700;display:none}
.unit.s-idle .zz,.unit.s-done .zz{display:block}
.zz span{position:absolute;left:0;bottom:0;opacity:0;animation:zz 4.2s ease-out infinite}
.zz span:nth-child(1){font-size:15px;animation-delay:-.7s}
.zz span:nth-child(2){font-size:19px;animation-delay:-2.1s}
.zz span:nth-child(3){font-size:25px;animation-delay:-3.5s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}18%{opacity:.85}100%{opacity:0;transform:translate(26px,-62px)}}
.tall .zz{top:-8px}
.tall .zz span{animation-name:zzs}
@keyframes zzs{0%{opacity:0;transform:translate(0,0)}18%{opacity:.85}100%{opacity:0;transform:translate(22px,-40px)}}

/* 「干完啦」「喊你了」：窗上冒一个小气泡，几秒后消失 */
.pop{position:absolute;left:50%;top:-14px;transform:translate(-50%,-100%);white-space:nowrap;padding:4px 11px;border-radius:5px;
  font-size:13px;font-weight:700;pointer-events:none;animation:pop 6s ease-out forwards;z-index:2}
.pop::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0}
.pop.d{background:#e9dfc6;color:#3b2f1a}.pop.d::after{border-top-color:#e9dfc6}
.pop.w{background:#f3c6cf;color:#4a1d28}.pop.w::after{border-top-color:#f3c6cf}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-80%)}8%{opacity:1;transform:translate(-50%,-100%)}80%{opacity:1}100%{opacity:0}}

/* 门牌 */
.plate{position:relative;margin-top:14px;width:calc(var(--ww) - 18px);padding:9px 12px 10px;border-radius:4px;
  background:var(--cream);color:var(--ink);box-shadow:0 3px 0 #b3a47f;transition:background .6s}
.plate::before,.plate::after{content:"";position:absolute;top:-14px;width:2px;height:14px;background:#4a4f6c}
.plate::before{left:22px}.plate::after{right:22px}
.unit.cool .plate{background:#bcc5e0;box-shadow:0 3px 0 #8790b0}
.unit.s-waiting .plate{box-shadow:0 3px 0 #b3a47f,0 0 0 3px #d04760}
/* 在等你：窗框和窗台也换成红色，余光里和「干活中」的暖窗一眼分开 */
.unit.s-waiting .win{border-color:#8a2c40;box-shadow:inset 0 0 0 2px #b8445c}
.unit.s-waiting .win .transom{background:#8a2c40}
.unit.s-waiting .sill{background:#a3384f;border-bottom-color:#6b2232}
.plate .st{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#4a3d22}
.unit.cool .plate .st{color:#2a3150}
.unit.s-waiting .plate .st{color:#a3263f}
.plate .st b{font-family:var(--mono);font-size:14px}
.bulb{width:10px;height:10px;border-radius:50%;background:#d08a2e;box-shadow:0 0 0 2px rgba(208,138,46,.25);flex:none}
.unit.cool .bulb{background:transparent;border:2px solid #4a5478;box-shadow:none}
.unit.s-waiting .bulb{background:#d04760;box-shadow:0 0 0 2px rgba(208,71,96,.25)}
.plate .ttl{margin-top:5px;font-size:15px;font-weight:700;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plate .nm{margin-top:4px;font-family:var(--mono);font-size:12.5px;color:#4d4a40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit.cool .plate .nm{color:#353d5c}
.plate .nm .sub{font-family:var(--sans);margin-left:6px}
.ac{position:absolute;left:calc(100% + 9px);top:calc(var(--wh) - 30px);width:36px;height:30px;background:#3a3f5b;border-radius:2px;box-shadow:inset 0 -3px 0 #30344c}
.ac::before{content:"";position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:repeating-radial-gradient(circle,#2a2e44 0 2px,#3a3f5b 2px 4px)}

/* 两层及以上：楼靠右，状态句竖排在左边天空里 */
.tall .building{left:auto;right:84px;transform:none}
.tall .status .pt{display:block}
.tall .status .sep{display:none}
.tall .status{left:52px;top:40px;max-width:250px}
.tall .status .hl{line-height:1.3;font-size:30px}
.tall .moon{right:auto;left:110px;top:auto;bottom:330px}
.tall .floor{padding:16px 0 12px}
.tall .plate{padding:7px 11px 8px}
.tall .plate .ttl{font-size:14.5px;margin-top:3px}
.tall .plate .nm{margin-top:2px}
.tall .ground{height:140px}
.tall .mail{margin-bottom:10px}
.tall .roof{height:40px}
.tall .entry .door{height:72px}
.tall .entry .sign{margin-bottom:5px;padding:2px 12px}
.scroll .building{position:relative;left:auto;right:auto;bottom:auto;margin:40px 84px 46px auto;width:max-content}
.scroll .skyline{display:none}

/* ---------- 一楼 ---------- */
.ground{position:relative;height:168px;border-top:7px solid var(--ledge);background:var(--ground);
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 64px 0 56px}
.mail{position:relative;margin-bottom:18px;padding:10px 12px 12px;background:#2b3047;border:2px solid #3a4060;border-radius:3px}
.mail .lb{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;white-space:nowrap}
.mail .lb b{font-size:15px;color:var(--fg)}
.mail .lb span{font-size:13px;color:var(--fg3)}
.mail .slots{display:grid;grid-template-columns:repeat(7,26px);gap:5px}
.slot{position:relative;height:30px;background:#363c59;border-radius:2px;box-shadow:inset 0 -2px 0 #2c3149}
.slot::before{content:"";position:absolute;left:5px;right:5px;top:8px;height:3px;background:#1a1c29;border-radius:2px}
.slot i{position:absolute;left:7px;top:2px;width:13px;height:8px;background:#d9cdb0;border-radius:1px;transform:rotate(-6deg)}
.slot.old i{background:#8f8a7c;top:5px;height:5px}
.slot.empty i{display:none}
.mail:hover{border-color:#565f89}
.entry{position:relative;align-self:flex-end;display:flex;flex-direction:column;align-items:center}
.entry .sign{margin-bottom:8px;padding:4px 12px;background:var(--cream);color:var(--ink);font-size:14px;font-weight:700;border-radius:3px;letter-spacing:.12em}
.entry .canopy{width:170px;height:10px;background:#3a3f5b;border-radius:2px}
.entry .lampc{width:8px;height:5px;background:#c8d3f5;border-radius:0 0 4px 4px}
.entry .door{margin-top:6px;width:104px;height:110px;border:6px solid var(--frame);border-bottom:0;background:linear-gradient(#2e3756,#232a44);display:grid;grid-template-columns:1fr 1fr;gap:5px}
.entry .door i{background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%);border-right:5px solid var(--frame)}
.entry .door i:last-child{border-right:0}
.entry .step{width:150px;height:8px;background:#2f3347}
.bike{width:150px;height:84px;margin-bottom:6px;flex:none}

.street{position:fixed;left:0;right:0;bottom:0;height:46px;background:var(--street);border-top:2px solid #262a3d;z-index:1}
.street::after{content:"";position:absolute;left:0;right:0;top:24px;height:2px;background:repeating-linear-gradient(to right,#232636 0 40px,transparent 40px 90px)}
/* 主题切换：街角的小路牌 */
.signpost{position:fixed;right:36px;bottom:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.signpost::before{content:"";position:absolute;left:14px;top:-4px;bottom:0;width:4px;background:#3a3f5b;z-index:-1}
.signpost a{display:block;padding:2px 12px 2px 10px;font-size:12.5px;font-weight:700;color:#d9dff5;background:#2f3a5c;text-decoration:none;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-right:16px}
.signpost a:nth-child(2){background:#3a4a3c;color:#dde8d2}
.signpost a:hover{filter:brightness(1.25)}
.signpost .here{font-size:12px;color:var(--fg3);padding-left:24px}

/* ---------- 窗里的动效 ---------- */
.room .cone{animation:flick 7.5s infinite}
@keyframes flick{0%,90%,100%{opacity:.5}91.5%{opacity:.28}93%{opacity:.5}94.5%{opacity:.36}}
.room .steam{animation:steam 4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-6px)}}
.room .ember{animation:ember 5s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.16}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ---------- 详情：推进到那扇窗 ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,9,15,.72);opacity:0;pointer-events:none;transition:opacity .45s;z-index:5}
#scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;left:72px;top:36px;right:72px;bottom:36px;display:none;z-index:6;
  border:14px solid var(--frame);border-radius:6px;background:#1a1b28;box-shadow:inset 0 0 0 2px #2c3150,0 30px 80px rgba(0,0,0,.45)}
.panel.open{display:grid;grid-template-columns:348px 1fr}
.panel .in{opacity:1;transition:opacity .35s .25s}
.panel.flying .in{opacity:0;transition:none}

.side{position:relative;background:#1e2030;border-right:2px solid #2c3150;padding:22px 22px 18px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3b4261 transparent}
.side .rw{position:relative;flex:none;height:244px;border:7px solid var(--frame);border-radius:3px;box-shadow:inset 0 0 0 2px #2c3150;overflow:hidden}
.side .rw svg{display:block;width:100%;height:100%}
.side .rw,.win .glass{contain:paint}
/* 刚推门、时间线还在下载时，屋里的动画先停一下：SVG 动画占主线程，会拖慢大段记录的解析 */
.panel.loading *{animation-play-state:paused!important}
.side .unit{display:block}
.side .plate{width:auto;margin:16px 6px 0}
.side .plate .ttl{-webkit-line-clamp:3;font-size:16px}
.meta{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px;align-content:start}
.meta dt{color:var(--fg3);font-size:13px;padding-top:1px;white-space:nowrap}
.meta dd{color:var(--fg);word-break:break-all;min-width:0}
.meta dd.mono{font-family:var(--mono);font-size:13.5px}
.meta dd.q{color:var(--fg2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kits{display:flex;flex-direction:column;gap:2px}
.kits button{display:flex;align-items:center;gap:8px;padding:4px 6px;margin-left:-6px;border-radius:4px;font-size:13.5px;color:var(--fg2);min-width:0}
.kits button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kits button:hover{background:#262a3e;color:var(--fg)}
.kits button.sel{background:#2b2f47;color:var(--fg)}
.kits i{width:8px;height:8px;border-radius:50%;border:1.5px solid #5a6390;flex:none}
.kits button.live i{background:var(--lamp);border-color:var(--lamp)}
.side .backs{margin-top:auto;padding:18px 0 18px;display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#1e2030}
.btn{padding:8px 13px;border:2px solid #3b4261;border-radius:4px;font-size:14px;color:var(--fg)}
.btn:hover{border-color:var(--fg3)}
.btn kbd{font-family:var(--mono);font-size:12px;color:var(--fg3);margin-left:8px;padding:1px 5px;border:1px solid #3b4261;border-radius:3px}

.tl{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.tlh{display:flex;align-items:center;gap:14px;padding:18px 34px 14px;border-bottom:2px solid #24273a}
.tlh h2{font-size:18px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tlh .c{font-size:13px;color:var(--fg3);white-space:nowrap}
.tlh .tg{margin-left:auto;display:flex;gap:4px;padding:3px;border:1px solid #33395a;border-radius:6px;flex:none}
.tlh .tg button{padding:5px 11px;font-size:13px;color:var(--fg3);border-radius:4px;white-space:nowrap}
.tlh .tg button.on{background:#2b2f47;color:var(--fg)}
.wbar{display:none;padding:9px 34px;background:#3a2330;color:#ffd0d8;font-size:14px;font-weight:700;border-bottom:2px solid #5a2f3e}
.wbar.show{display:block}
.list{flex:1;overflow-y:auto;padding:16px 34px 60px;scrollbar-width:thin;scrollbar-color:#3b4261 transparent}
.list.talk .ev.tools,.list.talk .ev.think,.list.talk .ev.sysl{display:none}
.list.nometa .ev.opt{display:none}

"use strict";
/* ============================================================ 总览：一栋夜里的公寓 */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = localStorage;
const QS = new URLSearchParams(location.search);
const DEMO = QS.get("demo") === "1";                       // 仅调试：把会话改写成各种状态
const DEMO_N = QS.has("n") ? Math.max(0, Math.min(12, +QS.get("n") || 0)) : null;
const nowS = () => Date.now() / 1000;
const realSid = sid => String(sid).replace(/-demo\d+$/, "");

const STATE = {
  busy:    {word: "干活中", cool: false},
  waiting: {word: "在等你", cool: false},
  done:    {word: "刚收工", cool: true},
  idle:    {word: "睡着了", cool: true},
  dead:    {word: "已退出", cool: true},
  gone:    {word: "已结束", cool: true},
};
const grpOf = it => (STATE[it.group] && it.group !== "gone") ? it.group : "idle";
const titleOf = it => it.title || it.prompt || it.name || String(it.sid).slice(0, 8);
// 门牌 / 详情标题：「[developer] …」这类前缀拆成小标签
function titleHTML(it) { const {role, t} = cleanTitle(it); return (role ? `<span class="role">${esc(role)}</span>` : "") + esc(t); }

const G = {data: null, live: [], units: new Map(), order: null, histSig: null, roof: null, k: 5,
           floorsN: 1, fail: 0};

function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}
function fmtAgo(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return "刚刚";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " 分钟前";
  return Math.floor(m / 60) + " 小时 " + (m % 60) + " 分前";
}
const hhmmss = d => d.toLocaleTimeString("zh-CN", {hour12: false});

/* ---------- 星星：固定伪随机，纯装饰 ---------- */
(() => { let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let h = ""; for (let i = 0; i < 46; i++) { const x = r()*100, y = r()*100, b = r() > .82, tw = r() > .7;
    if (x < 46 && y < 40) continue;
    h += `<i class="${b ? "b " : ""}${tw ? "tw" : ""}" style="left:${x}%;top:${y}%;opacity:${(.25 + r()*.5).toFixed(2)};animation-delay:${(-r()*6).toFixed(1)}s"></i>`; }
  $("#stars").innerHTML = h; })();

/* ---------- 窗里的房间（SVG 只画静物；住户是 Clawd，见下） ---------- */
let uidN = 0;
function roomSVG(grp) {
  const u = "r" + (uidN++);
  if (grp === "busy" || grp === "waiting") {
    return `<svg class="room" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${u}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d9a6"/><stop offset="1" stop-color="#e3b575"/></linearGradient></defs>
    <rect width="240" height="180" fill="url(#${u}w)"/>
    <rect x="66" y="30" width="28" height="34" rx="2" fill="#c48b52"/><rect x="70" y="34" width="20" height="26" fill="#f1d39d"/>
    <path d="M70 60 L77 48 L82 54 L85 50 L90 60Z" fill="#a8774a"/>
    <rect x="170" y="44" width="52" height="4" fill="#a36b3d"/>
    <rect x="174" y="31" width="6" height="13" fill="#5f7bb8"/><rect x="181" y="34" width="5" height="10" fill="#9a5b46"/><rect x="187" y="29" width="6" height="15" fill="#6f8a52"/>
    <rect x="205" y="37" width="10" height="7" fill="#b0643f"/><ellipse cx="207" cy="33" rx="4" ry="5" fill="#6f9a4e"/><ellipse cx="214" cy="32" rx="3.5" ry="5.5" fill="#7fae58"/>
    <rect y="146" width="240" height="34" fill="#b27544"/><rect y="146" width="240" height="2.5" fill="#985f35"/>
    <ellipse cx="120" cy="165" rx="74" ry="10" fill="#9c5f3a"/>
    <polygon class="cone" points="38,70 14,150 74,150" fill="#fff7e0" opacity=".5"/>
    <rect x="36" y="74" width="3" height="78" fill="#3b2f3a"/><ellipse cx="37.5" cy="153" rx="11" ry="3" fill="#3b2f3a"/>
    <path d="M26 74 L30 56 H45 L49 74Z" fill="#fff1cf"/><path d="M26 74 L30 56 H45 L49 74Z" fill="none" stroke="#d9a466" stroke-width="1.5"/>
    <rect x="196" y="134" width="24" height="4" rx="1" fill="#6b4630"/><rect x="199" y="138" width="3" height="14" fill="#57382a"/><rect x="214" y="138" width="3" height="14" fill="#57382a"/>
    <rect x="203" y="123" width="10" height="11" rx="2" fill="#f3ead8"/><path d="M213 126 q5 0 5 3.5 q0 3.5 -5 3.5" stroke="#f3ead8" stroke-width="2" fill="none"/>
    <path class="steam" d="M207 119 q-3 -4 0 -7 q3 -3 0 -7" stroke="#fff7e0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="0" y="0" width="13" height="180" fill="#cf8a5a"/><rect x="5" y="0" width="2" height="180" fill="#b8744a"/>
    <rect x="227" y="0" width="13" height="180" fill="#cf8a5a"/><rect x="232" y="0" width="2" height="180" fill="#b8744a"/>
    </svg>`;
  }
  // 灯灭了：月光照进来，地上铺着被褥，窗帘半拉
  return `<svg class="room" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${u}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f31"/><stop offset="1" stop-color="#222840"/></linearGradient></defs>
    <rect width="240" height="180" fill="url(#${u}w)"/>
    <path d="M52 22 H126 L116 96 H40Z" fill="#2b3453"/><path d="M88 22 L80 96 M46 56 H122" stroke="#1d2235" stroke-width="3"/>

/* ---------- 住户：Clawd（取景和状态映射在 /assets/clawd/clawd.js） ---------- */

// 干活姿势由 clawd.js 统一分配并记在 localStorage，三个主题里同一个会话是同一种姿势

// 往一个「玻璃」容器里放住户：一只主 Clawd + 最多三只小帮手。k = 每个 Clawd 像素几个屏幕像素

function refreshClawds(glass, s, grp) {

  glass.querySelectorAll(".clawd.mini").forEach((m, i) => Clawd.set(m, Clawd.F(st[i] ? "mini-crabwalk" : "mini-sleep")));

/* ---------- 门牌 ---------- */
function plateInner(s, grp) {

/* ---------- 一扇窗 = 一个会话。只改变化的那扇 ---------- */
function makeUnit(s) {

    frag.append(f);
  }

      bld.style.transform = (floorsN > 1 ? "" : "translateX(-50%) ") + `scale(${sc.toFixed(3)})`; }
  });
}

/* ---------- 信箱 ---------- */
function cleanTitle(h) {

/* ---------- 提醒：标签页标题由这里写；提示音和标签页小图标交给共用的 /assets/ccmon/alert.js ---------- */

/* ---------- 仅调试：?demo=1[&n=0..12] 把真实会话改写成各种状态 ---------- */
function demoize(d) {
  const base = d.groups.flatMap(g => g.items);
  let items = base.map(x => ({...x}));
  if (DEMO_N != null) { items = [];
    for (let i = 0; i < DEMO_N && base.length; i++) { const b = base[i % base.length];
      items.push({...b, sid: i < base.length ? b.sid : b.sid + "-demo" + i, pid: (b.pid || 0) + i * 100000}); } }
  const cyc = ["waiting", "busy", "done", "idle", "dead", "busy"], t = nowS();
  items.forEach((x, i) => { x.group = cyc[i % cyc.length]; x.since = t - (i + 1) * 437;
    x.subagents = (x.subagents || []).map((a, k) => ({...a, mtime: k === 0 && x.group === "busy" ? t : a.mtime})); });
  const groups = ["waiting", "busy", "done", "idle", "dead"].map(k => ({key: k, items: items.filter(x => x.group === k)}));
  return {...d, groups};
}

/* ---------- 轮询 ---------- */
function applyData(d) {
  G.data = d;
  const list = d.groups.flatMap(g => g.items.map(x => ({...x, group: x.group || g.key})))
    .sort((a, b) => ((a.pid ?? 1e12) - (b.pid ?? 1e12)) || String(a.sid).localeCompare(String(b.sid)));
  G.live = list;
  G.k = list.length > 3 ? 4 : 5;                 // 两层以上窗小一号，Clawd 也小一号（整数倍才锐利）
  for (const s of list) updateUnit(G.units.get(s.sid) || makeUnit(s), s);
  const order = list.map(s => s.sid).join();
  if (order !== G.order) {
    for (const [sid] of G.units) if (!list.some(s => s.sid === sid)) G.units.delete(sid);
    G.order = order;
    layout(list);
  }
  renderSky(list);
  renderMail(d.history || []);
  alertWaiting(list);
  if (typeof onSessions === "function") onSessions();
}
async function poll() {
  const conn = $("#conn");
  try {

    if (!r.ok) throw new Error("HTTP " + r.status);
    let d = await r.json();
    const evs = CCAlert.observe(d);          // 传原始返回，不传 demo 改写过的
    if (DEMO) d = demoize(d);

  }
  setTimeout(poll, 1500);
}

/* ---------- 每秒：时长、住户姿势（闲久了会从打哈欠变成睡死）、信箱时间 ---------- */
setInterval(() => {

<script>

const noAnsi = s => String(s ?? "").replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");

/* ---------- 迷你 markdown：围栏代码、表格、列表、标题、粗体、行内代码 ---------- */
function inl(s) { return esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>"); }
function md(src) {
  const L = String(src ?? "").split("\n"); let o = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\s*```/.test(l)) { const c = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) c.push(L[i++]); i++;
      o += `<pre>${esc(c.join("\n"))}</pre>`; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      o += "<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k ? `<td>${inl(c)}</td>` : `<th>${inl(c)}</th>`).join("") + "</tr>").join("") + "</table>"; continue; }
    if (/^#{1,6}\s/.test(l)) { o += `<h4>${inl(l.replace(/^#+\s*/, ""))}</h4>`; i++; continue; }
    if (/^\s*[-*•]\s+/.test(l)) { o += "<ul>"; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])) o += "<li>" + inl(L[i++].replace(/^\s*[-*•]\s+/, "")) + "</li>"; o += "</ul>"; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { o += "<ol>"; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) o += "<li>" + inl(L[i++].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; o += "</ol>"; continue; }
    if (!l.trim()) { i++; continue; }
    const p = [L[i++]];   // 至少吃掉一行，任何没认出来的写法都不会卡死
    while (i < L.length && L[i].trim() && !/^\s*(\||```|#{1,6}\s|[-*•]\s|\d+[.)]\s)/.test(L[i])) p.push(L[i++]);
    o += "<p>" + p.map(inl).join("<br>") + "</p>";
  }
  return o;
}

/* ---------- 来信：解析队友消息 ---------- */
const STAMP = {orange: "#ff9e64", pink: "#f7768e", yellow: "#e0af68", blue: "#7aa2f7", green: "#9ece6a", red: "#f7768e", purple: "#bb9af7", cyan: "#7dcfff"};

  const attr = k => (m[1].match(new RegExp(k + '="([^"]*)"')) || [])[1];

}

}
function inputHtml(name, inp) {
  if (inp && (name === "Edit" || name === "MultiEdit")) {
    const edits = name === "MultiEdit" ? (inp.edits || []) : [inp];
    return `<div class="cl">${esc(inp.file_path)}${inp.replace_all ? "（全部替换）" : ""}</div><pre>` + edits.map(e =>
      String(e.old_string ?? "").split("\n").map(l => `<span class="del">- ${esc(l)}</span>`).join("\n") + "\n" +
      String(e.new_string ?? "").split("\n").map(l => `<span class="add">+ ${esc(l)}</span>`).join("\n")).join("\n⋯\n") + "</pre>";
  }
  if (inp && name === "Bash" && typeof inp.command === "string") return `<pre>$ ${esc(inp.command)}</pre>`;
  if (inp && name === "Write" && typeof inp.content === "string") return `<div class="cl">${esc(inp.file_path)}</div><pre>${esc(inp.content)}</pre>`;
  if (inp && name === "TodoWrite" && Array.isArray(inp.todos))
    return `<pre>${inp.todos.map(t => (t.status === "completed" ? "[x] " : t.status === "in_progress" ? "[>] " : "[ ] ") + esc(t.content)).join("\n")}</pre>`;
  return `<pre>${esc(JSON.stringify(inp, null, 2))}</pre>`;
}
function pendingState() {
  const f = findSession(D.sid);
  if (D.agent) return ["run", "进行中"];
  if (f && f.grp === "waiting") return ["wait", "等你批准"];
  if (f && f.grp === "busy") return ["run", "进行中"];
  return ["run", "没有结果"];
}
function paintCap(rec) {
  const dot = rec.cap.querySelector(".ok"), stx = rec.cap.querySelector(".stx");
  if (!dot || !stx) return;   // 「想了一下」胶囊也放在 D.tools 里，但它没有状态点
  if (rec.res) { dot.className = "ok" + (rec.res.err ? " err" : ""); stx.textContent = rec.res.err ? "出错" : ""; stx.className = "stx w";
    rec.cap.classList.toggle("err", !!rec.res.err); return; }
  const [c, w] = pendingState();
  dot.className = "ok " + c; stx.textContent = w; stx.className = "stx" + (c === "wait" ? " w" : "");
}
function capDetail(rec) {
  const e = rec.ev, r = rec.res;
  if (rec.think) return `<div class="capd"><div class="sec"><div class="cl">想了一下 <button class="lnk" data-ln="${e.ln}">原始记录</button>${cutLnk(e)}</div><p class="thk">${esc(String(e.text || "").trim())}</p></div></div>`;
  const sub = (findSession(D.sid)?.s.subagents || []).find(a => a.toolUseId === e.id);
  let h = `<div class="sec"><div class="cl">参数 <button class="lnk" data-ln="${e.ln}">原始记录</button>${sub && !D.agent ? `<button class="lnk" data-agent="${esc(sub.id)}">打开这个小帮手的记录</button>` : ""}</div>${inputHtml(e.name, e.input)}</div>`;
  if (r) {
    const f = cleanFile(r.file);
    h += `<div class="sec"><div class="cl">结果${r.err ? "（出错）" : ""} <button class="lnk" data-ln="${r.ln}">原始记录</button>${f ? `<button class="lnk" data-file="${esc(f)}">输出太大已落盘，看完整输出</button>` : ""}${r.cut ? `<button class="lnk" data-ln="${r.ln}">已截断（共 ${r.len} 字），看全文</button>` : ""}</div><pre>${esc(noAnsi(r.text))}</pre></div>`;
  } else h += `<div class="sec"><div class="cl">${pendingState()[1]}</div></div>`;
  return `<div class="capd">${h}</div>`;
}

function ensureRow(t) {
  let row = D.lastRow;
  if (!row || !row.isConnected) { row = el(`<div class="ev tools">${t}<div><div class="caps"></div></div></div>`); push(row, false); D.lastRow = row; }
  return row;
}
/* ---------- 长串工具调用：超过 6 个只露前 2 个 +「还有 N 个」+ 最后 3 个 ---------- */
function foldRow(row) {
  if (row.dataset.open) return;
  const box = row.querySelector(".caps"), caps = [...box.querySelectorAll(".cap")];
  let more = box.querySelector(".capmore");
  if (caps.length <= 6) { more?.remove(); return; }
  caps.forEach((c, i) => c.classList.toggle("hid", i >= 2 && i < caps.length - 3));
  if (!more) { more = document.createElement("button"); more.className = "capmore"; }
  more.textContent = `… 还有 ${caps.length - 5} 个`;
  caps[1].after(more);
}

/* ---------- 渲染一条事件 ---------- */
const rawBtn = ln => `<button class="raw" data-ln="${ln}" title="看这一行的原始 JSON">{ }</button>`;
const cutLnk = e => e.cut ? `<button class="lnk" data-ln="${e.ln}">内容过长已截断，看全文</button>` : "";
function push(node, breaksRun = true) { list.append(node); if (breaksRun) D.lastRow = null; }
function render(e) {
  const t = `<span class="t">${hhmm(e.ts)}</span>`;
  switch (e.k) {
    case "tool": {
      const row = ensureRow(t);
      const [a, b] = capLabel(e.name, e.input);
      const cap = el(`<button class="cap" data-id="${esc(e.id)}"><i class="ok"></i><span class="n">${esc(a)}</span>${b ? `<span>${esc(b)}</span>` : ""}<i class="stx"></i></button>`);
      row.querySelector(".caps").append(cap);
      foldRow(row);
      const rec = D.tools[e.id] = {cap, ev: e, res: null, row};
      paintCap(rec);
      return;
    }
    case "result": {
      const rec = D.tools[e.id];
      if (!rec) {  // 调用在「更早」那部分没加载
        const fake = {id: e.id, ln: e.ln, name: "结果", input: {}};
        render({...fake, k: "tool", ts: e.ts}); D.tools[e.id].res = e; paintCap(D.tools[e.id]); return;
      }
      rec.res = e; paintCap(rec);
      if (rec.cap.classList.contains("on")) { rec.row.querySelector(".capd")?.remove(); rec.row.lastElementChild.insertAdjacentHTML("beforeend", capDetail(rec)); }
      return;
    }
    case "title": if (!D.agent) setTitle(e.text); return;
    case "text":
      D.n++;
      return push(el(`<div class="ev">${rawBtn(e.ln)}${t}<div class="reply"><div class="who">${avatar()}${D.agent ? "小帮手" : "Claude"}</div><div class="md">${md(e.text)}</div>${cutLnk(e)}</div></div>`));
    case "prompt": {
      if (/^\s*<task-notification>/.test(e.text || "")) {   // 后台小帮手干完了的回报：不是人说的话，压成一张小纸条
        const tag = k => ((e.text.match(new RegExp(`<${k}>([\\s\\S]*?)(?:</${k}>|$)`)) || [])[1] || "").trim();
        const id = tag("task-id"), sub = (findSession(D.sid)?.s.subagents || []).find(a => a.id === id);
        const res = tag("result").replace(/^\[harness:[^\]]*\]\s*/, "");
        return push(el(`<div class="ev">${rawBtn(e.ln)}${t}<div class="note"><div class="lb">小帮手回报 · ${esc(tag("status") || "")}</div>
          <p>${esc(tag("summary") || id)}</p>${res ? `<details class="think-b"><summary><span class="dots">···</span>看它交回来的内容</summary><p style="font-style:normal">${esc(res)}</p></details>` : ""}
          ${sub && !D.agent ? `<button class="lnk" data-agent="${esc(sub.id)}">打开这个小帮手的记录</button>` : ""}${cutLnk(e)}</div></div>`));
      }
      D.n++;
      const p = parsePrompt(e.text), long = p.body.length > 260 || p.body.split("\n").length > 5;
      return push(el(`<div class="ev">${rawBtn(e.ln)}${t}<div class="letter${p.me ? " me" : ""}">
        <div class="hd">${p.me ? "" : `<i class="stamp" style="background:${p.color}"></i>`}<b>${esc(p.from)}</b>${p.me ? "说" : "来信"}</div>
        ${p.sum ? `<div class="sum">${esc(p.sum)}</div>` : ""}
        ${p.body ? `<div class="bodyw${long ? " fade" : ""}" ${long ? "" : 'style="max-height:none"'}><div class="md">${md(p.body)}</div></div>` : ""}
        ${long || e.cut ? `<div class="ft">${long ? '<button class="lnk more">展开全文</button>' : ""}${cutLnk(e)}</div>` : ""}</div></div>`));
    }
    case "think": {   // 思考并进同一串胶囊里，压成一颗「···」，点开才看；不再把工具串切成一行一行
      const row = ensureRow(t), id = "th" + e.ln;
      const cap = el(`<button class="cap thk" data-id="${id}" title="想了一下（点开看）"><span class="n">···</span><span>想了一下</span></button>`);
      row.querySelector(".caps").append(cap);
      D.tools[id] = {cap, ev: e, think: true, row};
      foldRow(row);
      return;
    }
    case "meta": case "att": {
      const opt = e.k === "att" || !e.show;
      return push(el(`<div class="ev${opt ? " opt" : ""}">${rawBtn(e.ln)}${t}<div class="note"><div class="lb">${esc(e.label || e.k)}</div>${e.text ? `<pre>${esc(String(e.text).slice(0, 4000))}</pre>` : ""}${cutLnk(e)}</div></div>`), !opt);
    }
    case "sys":
      if (e.label === "away_summary")
        return push(el(`<div class="ev">${t}<div class="note"><div class="lb">你离开时的小结</div><p>${esc(String(e.text).replace(/\s*\(disable recaps in \/config\)\s*$/, ""))}</p></div></div>`));
      return push(el(`<div class="ev sysl">${t}<div class="s">${esc(e.text || e.label)}</div></div>`));
  }
}
function addEvents(evs) {
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  for (const e of evs) render(e);
  if (D.follow && (atBottom || evs.length > 50)) list.scrollTop = list.scrollHeight;
  $("#tlc").textContent = D.n ? `${D.n} 条对话 · 实时` : "实时";
}
function setTitle(t) { if (t) { D.title = t; if (!D.agent) $("#tlTitle").innerHTML = titleHTML({title: t}); } }

/* ---------- SSE ---------- */
function openStream() {
  if (D.es) D.es.close();
  list.innerHTML = `<div class="hint">推门进去…</div>`;
  panel.classList.add("loading");
  const qs = new URLSearchParams({sid: realSid(D.sid)});
  if (D.agent) qs.set("agent", D.agent);
  if (D.all) qs.set("all", "1");
  const es = D.es = new EventSource("/api/stream?" + qs);
  es.addEventListener("init", ev => {
    const d = JSON.parse(ev.data);
    list.innerHTML = ""; D.tools = {}; D.lastRow = null; D.n = 0; D.follow = true;
    if (d.skipped) { const m = el(`<div class="skip"><button>更早还有 ${d.skipped} 条，全部加载</button></div>`);
      m.querySelector("button").onclick = () => { D.all = true; openStream(); }; push(m); }
    if (!D.agent) setTitle(d.title);
    addEvents(d.events);
    if (!d.events.length) push(el(`<div class="hint">这户还没有动静</div>`));
    list.scrollTop = list.scrollHeight;
    requestAnimationFrame(() => panel.classList.remove("loading"));
  });
  es.addEventListener("more", ev => addEvents(JSON.parse(ev.data).events));
  es.addEventListener("reset", () => openStream());
  es.onerror = () => { $("#tlc").textContent = "实时流断开，自动重连中…"; };
}

/* ---------- 左侧：放大的那扇窗 + 门牌 + 小帮手 ---------- */
function renderSide(force) {
  const f = findSession(D.sid);
  const s = f ? f.s : {sid: D.sid, name: "", title: "（还没找到这个会话）"};
  const grp = f ? f.grp : "gone";
  const subs = s.subagents || [];
  const sig = [grp, titleOf(s), s.cwd, subs.map(a => a.id).join(), D.agent].join("|");
  const wb = $("#wbar");
  wb.classList.toggle("show", grp === "waiting" && !D.agent);
  wb.textContent = `它停下来等你了（${s.label || "等待"}）—— 回台式机处理一下`;
  if (!force && sig === D.sideSig) { paintSubs(); return; }
  const roomGrp = grp === "gone" ? "dead" : grp;
  D.sideSig = sig;
  const ag = D.agent && subs.find(a => a.id === D.agent);
  $("#side").innerHTML = `<div class="rw${STATE[grp].cool ? " dim" : ""}${grp === "gone" ? " gone" : ""}">${roomSVG(roomGrp)}</div>
    <div class="unit s-${grp}${STATE[grp].cool ? " cool" : ""}"><div class="plate">${plateInner(s, grp)}</div></div>
    <dl class="meta">
      <dt>项目</dt><dd class="mono">${esc(s.cwd || "")}</dd>
      ${s.pid ? `<dt>进程</dt><dd class="mono">pid ${esc(s.pid)}</dd>` : ""}
      ${subs.length ? `<dt>小帮手</dt><dd class="kits">${subs.map(a => `<button data-agent="${esc(a.id)}" title="${esc(a.desc)}" class="${D.agent === a.id ? "sel" : ""}"><i></i><span>${esc(a.type || "agent")} · ${esc(a.desc || "")}</span></button>`).join("")}</dd>` : ""}
      ${s.prompt ? `<dt>最后一句</dt><dd class="q">${esc(parsePrompt(s.prompt).sum || parsePrompt(s.prompt).body)}</dd>` : ""}
    </dl>
    <div class="backs">${ag ? `<button class="btn" data-agent="">回到主会话</button>` : ""}<button class="btn" id="back">回到楼下<kbd>Esc</kbd></button></div>`;
  $("#tlTitle").innerHTML = ag ? esc(`小帮手 · ${ag.type || "agent"} · ${ag.desc || ""}`) : (D.title ? titleHTML({title: D.title}) : titleHTML(s));
  populate($("#side .rw"), s, grp, 6);
  paintSubs();
}
function paintSubs() {
  const f = findSession(D.sid); if (!f) return;
  const subs = f.s.subagents || [];
  document.querySelectorAll("#side .kits button").forEach(b => { const a = subs.find(x => x.id === b.dataset.agent);
    b.classList.toggle("live", !!a && subLive(a)); });
  const rw = $("#side .rw");
  if (rw) { if (rw.querySelectorAll(".clawd.mini").length !== kitCount(f.s)) populate(rw, f.s, f.grp, 6); else refreshClawds(rw, f.s, f.grp); }
}
$("#side").addEventListener("click", e => {
  if (e.target.closest("#back")) return closeAll();
  const a = e.target.closest("[data-agent]"); if (a) openDetail(D.sid, a.dataset.agent || null, false);
});

/* ---------- 打开 / 关上 ---------- */
// 从楼下点进某扇窗时 push 一条历史，浏览器「后退」能回到楼下；窗与窗之间切换只 replace
function setHash(h, push) {
  const url = location.pathname + location.search + (h ? "#" + h : "");
  if (url === location.pathname + location.search + location.hash) return;
  if (push) history.pushState({ccmon: 1}, "", url); else history.replaceState(history.state, "", url);
}
addEventListener("popstate", () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { if (D.sid) closeAll("none"); return; }
  const [sid, agent] = h.split("/");
  if (sid !== D.sid || (agent || null) !== D.agent) openDetail(sid, agent || null, false);
});
function openDetail(sid, agent, animate) {
  const same = panel.classList.contains("open") && D.sid === sid && D.agent === agent;
  const reopen = panel.classList.contains("open");
  if (D.sid !== sid) D.title = "";
  D.sid = sid; D.agent = agent; D.all = false;
  setHash(sid + (agent ? "/" + agent : ""), !reopen);
  renderCrumbs();
  renderSide(true);
  if (!same) openStream();
  panel.classList.add("open"); scrim.classList.add("open");
  const w = G.units.get(sid)?.el.querySelector(".win");
  if (animate && !reopen && w) {
    const r = w.getBoundingClientRect(), p = panel.getBoundingClientRect();
    scene.style.transformOrigin = `${r.left + r.width/2}px ${r.top + r.height/2}px`;
    scene.classList.add("zoomed");
    panel.classList.add("flying");
    panel.style.transition = "none"; panel.style.transformOrigin = "0 0";
    panel.style.transform = `translate(${r.left - p.left}px,${r.top - p.top}px) scale(${r.width/p.width},${r.height/p.height})`;
    void panel.offsetWidth;
    panel.style.transition = "transform .6s cubic-bezier(.3,.7,.2,1)";
    panel.style.transform = "none";
    setTimeout(() => panel.classList.remove("flying"), 30);
  } else { scene.style.transformOrigin = ""; scene.classList.add("zoomed"); }
}
function closeAll(nav) {
  if (nav !== "none" && location.hash && history.state && history.state.ccmon) { history.back(); return; }
  if (D.es) { D.es.close(); D.es = null; }
  D.sid = null; D.agent = null;
  panel.classList.remove("open"); scrim.classList.remove("open"); $("#drawer").classList.remove("open");
  scene.classList.remove("zoomed");
  if (nav !== "none") setHash("");
  renderCrumbs();
}
scrim.onclick = () => closeAll();
$("#drx").onclick = () => closeAll();

/* ---------- 原文弹窗 ---------- */
async function showModal(title, url) {
  $("#mTitle").textContent = title; $("#mBody").textContent = "加载中…"; $("#modal").classList.add("show");
  try { const r = await fetch(url); $("#mBody").textContent = noAnsi(await r.text()); }
  catch (err) { $("#mBody").textContent = "加载失败：" + err.message; }
}
$("#mClose").onclick = () => $("#modal").classList.remove("show");
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("show"); };
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modal").classList.contains("show")) $("#modal").classList.remove("show");
  else closeAll();
});

/* ---------- 时间线里的点击 ---------- */
list.addEventListener("click", e => {
  const more = e.target.closest(".more");
  if (more) { const l = more.closest(".letter"); l.classList.toggle("full"); more.textContent = l.classList.contains("full") ? "收起" : "展开全文"; return; }
  const ag = e.target.closest("[data-agent]"); if (ag) return openDetail(D.sid, ag.dataset.agent, false);
  const fl = e.target.closest("[data-file]"); if (fl) return showModal("完整输出 · " + fl.dataset.file, "/api/file?p=" + encodeURIComponent(fl.dataset.file));
  const ln = e.target.closest("[data-ln]");
  if (ln) { const qs = new URLSearchParams({sid: realSid(D.sid), ln: ln.dataset.ln}); if (D.agent) qs.set("agent", D.agent);
    return showModal(`原始记录 · 第 ${ln.dataset.ln} 行`, "/api/line?" + qs); }
  const cm = e.target.closest(".capmore");
  if (cm) { const row = cm.closest(".ev"); row.dataset.open = "1"; row.querySelectorAll(".cap.hid").forEach(c => c.classList.remove("hid")); cm.remove(); return; }
  const cap = e.target.closest(".cap");
  if (cap) { const rec = D.tools[cap.dataset.id]; if (!rec) return;
    const was = cap.classList.contains("on");
    rec.row.querySelectorAll(".cap").forEach(x => x.classList.remove("on")); rec.row.querySelector(".capd")?.remove();
    if (!was) { cap.classList.add("on"); rec.row.lastElementChild.insertAdjacentHTML("beforeend", capDetail(rec)); } }
});
list.addEventListener("scroll", () => {
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  D.follow = atBottom; $("#follow").classList.toggle("show", !atBottom);
});
$("#follow").onclick = () => { list.scrollTop = list.scrollHeight; D.follow = true; $("#follow").classList.remove("show"); };

/* ---------- 开关 ---------- */
document.querySelectorAll("#tgMode button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tgMode button").forEach(x => x.classList.toggle("on", x === b));
  list.classList.toggle("talk", b.dataset.m === "talk"); if (D.follow) list.scrollTop = list.scrollHeight;
});
const setMeta = on => { LS.ccmonMeta = on ? "1" : "0"; $("#bMeta").classList.toggle("on", on); list.classList.toggle("nometa", !on); };
$("#bMeta").onclick = () => setMeta(!$("#bMeta").classList.contains("on"));
setMeta(LS.ccmonMeta === "1");

/* ---------- 和总览的钩子 ---------- */
function onSessions() {
  if (!D.sid) return;
  renderSide(false);
  for (const id in D.tools) if (!D.tools[id].res) paintCap(D.tools[id]);
}
function onTick() { if (D.sid) paintSubs(); }

// 左上角面包屑：点了回楼下（关掉详情和信箱，滚回顶上）。打开详情时最后一级显示正在看谁
function renderCrumbs() {
  let t = "台式机上的 Claude 会话 · 只读";
  if (D.sid) {
    const it = G.live.find(x => x.sid === D.sid);
    t = "正在看：" + ((it && (it.title || it.prompt || it.name)) || D.title || D.sid.slice(0, 8)) + (D.agent ? " · 小帮手" : "");
  }
  if ($("#cHere").textContent !== t) $("#cHere").textContent = t;
  const st = document.querySelector(".status");   // 楼层多时状态句会挪位置，面包屑跟着它左对齐
  if (st && !D.sid) $("#crumbs").style.left = Math.max(16, Math.round(st.getBoundingClientRect().left)) + "px";   // 打开详情时楼被放大，量出来的位置不准，沿用上次的
}
setInterval(renderCrumbs, 1000);
for (const id of ["cHome", "cTheme"]) $("#" + id).onclick = e => { e.preventDefault(); closeAll(); window.scrollTo({top: 0}); };

/* ---------- 启动 ---------- */
Clawd.preload();
poll();
if (location.hash.length > 1) {
  const [sid, agent] = decodeURIComponent(location.hash.slice(1)).split("/");
  openDetail(sid, agent || null, false);
}
</script>
